<body class="locked">
  <!-- Opening: hero with the theatre curtains -->
  <header class="hero" id="hero">
    <div class="hero-inner" id="heroInner"></div>
    <canvas class="curtains" id="curtains" aria-hidden="true"></canvas>
    <button class="seal-wrap" id="openBtn" type="button" aria-label="Open the invitation">
      <span class="guest-note" id="guestNote"></span>
      <span class="seal" id="seal"></span>
      <span class="tap-hint" id="tapHint"></span>
    </button>
  </header>

  <main id="app" aria-live="polite"></main>

  <button class="fab fab-lang" id="langBtn" type="button" aria-label="Change language" hidden></button>
  <button class="fab fab-music" id="musicBtn" type="button" aria-label="Play or pause music" hidden></button>
  <audio id="bgm" loop preload="none"></audio>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <noscript><p style="padding:2rem;text-align:center">Please turn on JavaScript to view this invitation.</p></noscript>

  <script src="assets/js/shared.js"></script>
